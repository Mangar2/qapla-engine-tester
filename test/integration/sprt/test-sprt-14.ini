; H1 decision path: the challenger wins every game, so the test reaches
; H1Accepted (exit 14) after a few dozen games instead of the thousands two
; real engines of similar strength would need. The baseline forfeits on time,
; which is what makes the outcome both fast and deterministic.
concurrency=20
enginesfile=test/integration/engines/engines.ini

[sprt]
eloh0=0
eloh1=3
alpha=0.50
beta=0.20
maxgames=3000

[openings]
order=sequential
file=test/opening/book8ply.raw

[pgnoutput]
file=test/integration/log/sprt/test-sprt-14.pgn
append=false

[logging]
engine=false
path=test/integration/log/sprt
mode=one

[each]
tc=1+0.01

[engine]
conf=Qapla 0.4.0

[engine]
conf=diagnostic-engine-lossontime
